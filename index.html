.note audio{width:100%;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}

.back{background:none;border:none;color:#f5b301;padding:0}

 $('#bq').oninput=e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('.sec tr').forEach(tr=>tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none')};
 let pend={img:null,aud:null};
 $('#sv').onclick=async()=>{const t=$('#nt').value.trim();if(!t&&!pend.img&&!pend.aud)return;await addNote({brand:id,text:t,img:pend.img,aud:pend.aud,ts:Date.now()});pend={img:null,aud:null};$('#nt').value='';$('#recst').textContent='تم الحفظ ✅';show()};
 $('#cam').onclick=()=>$('#file').click();
 $('#file').onchange=e=>{const f=e.target.files[0];if(f){pend.img=f;$('#recst').textContent='الصورة جاهزة. اضغط حفظ.'}};
 let mr=null,ch=[];
 $('#mic').onclick=async()=>{
  if(mr&&mr.state==='recording'){mr.stop();return}
  if(!navigator.mediaDevices){$('#recst').textContent='المايك محتاج رابط https.';return}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true});mr=new MediaRecorder(st);ch=[];
   mr.ondataavailable=e=>ch.push(e.data);
   mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());pend.aud=new Blob(ch,{type:mr.mimeType});$('#mic').textContent='🎙️ سجّل بصوتك';$('#recst').textContent='التسجيل جاهز. اضغط حفظ.'};
   mr.start();$('#mic').textContent='⏹ إيقاف التسجيل';$('#recst').textContent='بيسجّل...'}
  catch(e){$('#recst').textContent='المايك مش مسموح. اسمح له من إعدادات الموقع في كروم.'}};
 async function show(){const ns=await getNotes(id);$('#notes').innerHTML=ns.map(n=>`<div class="note" data-id="${n.id}"><div class="tag">${new Date(n.ts).toLocaleString('ar-EG')}</div>${n.text?'<div>'+esc(n.text).replace(/\n/g,'<br>')+'</div>':''}${n.img?'<img data-i="'+n.id+'">':''}${n.aud?'<audio controls data-a="'+n.id+'"></audio>':''}<button class="red" data-d="${n.id}">مسح</button></div>`).join('');
  ns.forEach(n=>{if(n.img)document.querySelector(`[data-i="${n.id}"]`).src=URL.createObjectURL(n.img);if(n.aud)document.querySelector(`[data-a="${n.id}"]`).src=URL.createObjectURL(n.aud)});
  document.querySelectorAll('[data-d]').forEach(x=>x.onclick=async()=>{if(confirm('تمسح الملاحظة؟')){await delNote(+x.dataset.d);show()}})}
 show();
}
$('#homeBtn').onclick=home;
const dbp=openDB();(()=>{const h=decodeURIComponent(location.hash.slice(1));if(h==='quick'){quick();if(location.search.includes('t=')){$('#qb').value='b0';$('#qc').value='E1';$('#qg').click()}}else if(h.startsWith('b'))brand(h);else if(h.startsWith('k'))kbpage(+h.slice(1));else{home();if(h.startsWith('q=')){$('#q').value=h.slice(2);search(h.slice(2))}}})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
